name: openclaw

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: openclaw-gateway
    restart: unless-stopped
    networks:
      - openclaw_public
      - openclaw_private
    ports:
      - "${OPENCLAW_GATEWAY_HOST_IP:-127.0.0.1}:${OPENCLAW_GATEWAY_PORT:-18789}:${OPENCLAW_GATEWAY_PORT:-18789}"
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - OPENCLAW_PRIMARY_MODEL=${OPENCLAW_PRIMARY_MODEL}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${OPENCLAW_DOCKER_GID}"
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "${OPENCLAW_GATEWAY_PORT:-18789}",
      ]
    depends_on:
      - ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"

  openclaw-caddy:
    image: caddy:2.8.4
    container_name: openclaw-caddy
    restart: unless-stopped
    networks:
      - openclaw_public
    ports:
      - "${OPENCLAW_WG_HOST_IP:-10.10.0.1}:${OPENCLAW_HTTPS_PORT:-18443}:${OPENCLAW_HTTPS_PORT:-18443}"
    environment:
      - OPENCLAW_GATEWAY_HOSTNAME=${OPENCLAW_GATEWAY_HOSTNAME:-hyphae}
      - OPENCLAW_HTTPS_PORT=${OPENCLAW_HTTPS_PORT:-18443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: openclaw-cli
    restart: unless-stopped
    networks:
      - openclaw_public
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - OPENCLAW_PRIMARY_MODEL=${OPENCLAW_PRIMARY_MODEL}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${OPENCLAW_DOCKER_GID}"
    entrypoint: ["sh", "-c"]
    command: ["sleep infinity"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"

  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: ollama
    restart: unless-stopped
    networks:
      - openclaw_private
    volumes:
      - ${OLLAMA_DATA_DIR}:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  openclaw_public:

  openclaw_private:
    internal: true

volumes:
  caddy_data:
  caddy_config:
