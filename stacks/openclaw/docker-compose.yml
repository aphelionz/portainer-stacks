name: openclaw

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: openclaw-gateway
    restart: unless-stopped
    networks:
      - openclaw_public
      - openclaw_private
      - traefik
    ports:
      - "${OPENCLAW_GATEWAY_HOST_IP:-127.0.0.1}:${OPENCLAW_GATEWAY_PORT:-18789}:${OPENCLAW_GATEWAY_PORT:-18789}"
    labels:
      traefik.enable: "${OPENCLAW_TRAEFIK_ENABLE:-false}"
      traefik.http.routers.openclaw.rule: "Host(`${OPENCLAW_TRAEFIK_HOST:-hyphae}`)"
      traefik.http.routers.openclaw.entrypoints: "${OPENCLAW_TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.openclaw.service: "openclaw"
      traefik.http.services.openclaw.loadbalancer.server.port: "${OPENCLAW_GATEWAY_PORT:-18789}"
      traefik.http.routers.openclaw.tls: "true"
      traefik.http.routers.openclaw.tls.certresolver: "${OPENCLAW_TRAEFIK_CERTRESOLVER:-letsencrypt}"
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${OPENCLAW_DOCKER_GID}"
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "${OPENCLAW_GATEWAY_PORT:-18789}",
      ]
    depends_on:
      - ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: openclaw-cli
    restart: unless-stopped
    networks:
      - openclaw_public
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${OPENCLAW_DOCKER_GID}"
    entrypoint: ["sh", "-c"]
    command: ["sleep infinity"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"

  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: ollama
    restart: unless-stopped
    networks:
      - openclaw_private
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ${OLLAMA_DATA_DIR}:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  openclaw_public:

  openclaw_private:
    internal: true

  traefik:
    external: true
